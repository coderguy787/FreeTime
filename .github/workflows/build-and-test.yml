name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    services:
      mongodb:
        image: mongo:6.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      redis:
        image: redis:7.0
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies (master-server)
      working-directory: ./master-server
      run: npm ci

    - name: Lint code (ESLint)
      working-directory: ./master-server
      run: npm run lint --if-present
      continue-on-error: true

    - name: Format check (Prettier)
      working-directory: ./master-server
      run: npm run format:check --if-present
      continue-on-error: true

    - name: Syntax check
      working-directory: ./master-server
      run: |
        node -c api/master-server-api.js
        node -c utils/logger.js
        node -c utils/retry-logic.js
        node -c utils/circuit-breaker.js
        node -c utils/request-signing.js
        node -c utils/pool-monitor.js

    - name: Run unit tests
      working-directory: ./master-server
      run: npm test --if-present
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/securechat-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key-12345678901234567890

    - name: Upload test coverage
      if: always()
      uses: codecov/codecov-action@v3
      with:
        directory: ./master-server/coverage
        fail_ci_if_error: false

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          ./master-server/coverage/
          ./master-server/test-results/
        retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    services:
      mongodb:
        image: mongo:6.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

      redis:
        image: redis:7.0
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      working-directory: ./master-server
      run: npm ci

    - name: Start server in background
      working-directory: ./master-server
      run: |
        npm start > server.log 2>&1 &
        sleep 5
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/securechat-test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret-key-12345678901234567890
        PORT: 3000

    - name: Run integration tests
      working-directory: ./master-server
      run: npm run test:integration --if-present
      env:
        NODE_ENV: test
        MONGODB_URI: mongodb://localhost:27017/securechat-test
        REDIS_URL: redis://localhost:6379
        API_BASE_URL: http://localhost:3000
        JWT_SECRET: test-secret-key-12345678901234567890

    - name: Check server health
      run: |
        curl -f http://localhost:3000/health || exit 1
        echo "Server health check passed "

    - name: Upload server logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: server-logs
        path: ./master-server/server.log

  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      working-directory: ./master-server
      run: npm ci

    - name: Run npm audit
      working-directory: ./master-server
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run SNYK scan (optional)
      working-directory: ./master-server
      run: |
        npm install -g snyk
        snyk test --severity-threshold=high || true
      continue-on-error: true
