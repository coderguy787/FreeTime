name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    name: Dependency Scanning

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Run npm audit
      working-directory: ./master-server
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Check for outdated packages
      working-directory: ./master-server
      run: npm outdated --json > outdated.json || true

    - name: Upload outdated report
      uses: actions/upload-artifact@v3
      with:
        name: outdated-packages
        path: ./master-server/outdated.json
        retention-days: 30

    - name: Create issue for critical vulnerabilities
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Security: Critical vulnerabilities found in dependencies',
            body: 'npm audit found critical vulnerabilities. Please review and update dependencies.',
            labels: ['security', 'critical']
          })

  codeql:
    runs-on: ubuntu-latest
    name: CodeQL Analysis

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: 'javascript'

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      with:
        category: "/language:javascript"

  semgrep:
    runs-on: ubuntu-latest
    name: Semgrep Code Scanning

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/owasp-top-ten
          p/security-audit
          p/nodejs
        generateSarif: true

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: semgrep.sarif

  docker-scan:
    runs-on: ubuntu-latest
    name: Docker Image Scanning

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./master-server
        file: ./Dockerfile
        push: false
        tags: securechat-server:scan
        outputs: type=docker,dest=/tmp/image.tar
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        input: '/tmp/image.tar'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: trivy-results.sarif

  license-check:
    runs-on: ubuntu-latest
    name: License Compliance

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 20.x

    - name: Install license checker
      run: npm install -g license-checker

    - name: Check licenses
      working-directory: ./master-server
      run: |
        license-checker --json > licenses.json
        license-checker --markdown > LICENSE_REPORT.md

    - name: Upload license report
      uses: actions/upload-artifact@v3
      with:
        name: license-report
        path: ./master-server/LICENSE_REPORT.md
        retention-days: 30

    - name: Check for forbidden licenses
      working-directory: ./master-server
      run: |
        license-checker --onlyAllow "MIT,Apache-2.0,BSD,ISC,MPL-2.0,LGPL-2.1,GPL-2.0,GPL-3.0,Unlicense" || true
